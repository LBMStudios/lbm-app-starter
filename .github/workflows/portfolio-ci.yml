name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production files
        run: |
          test -s index.html
          test -s style.css
          grep -q 'https://lbmstudios.com/' index.html
          grep -q 'info@lbmstudios.com' index.html
          ! grep -Eqi 'CURRENT BUILD|STATIC MODE|lovable|media\.canva\.com|placeholder|draft' index.html style.css

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start static site
        run: python3 -m http.server 4173 >/tmp/lbm-http.log 2>&1 &
      - name: Install Chromium for smoke test
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Render home page
        run: npx --yes playwright@1.55.0 screenshot --device='Desktop Chrome HiDPI' http://127.0.0.1:4173 /tmp/lbm-home.png
      - name: Verify render artifact
        run: test -s /tmp/lbm-home.png
