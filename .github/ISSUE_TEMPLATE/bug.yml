name: Error
description: Reporta un comportamiento reproducible.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos y entorno para reproducir
    validations:
      required: true
